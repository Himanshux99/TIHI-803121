a{color:var(--g)}#top{display:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px;z-index:9;align-items:center;gap:12px}
button,.btn{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer;font:15px system-ui;text-decoration:none;display:inline-block}.btn.p{background:var(--g);color:var(--gt);border-color:var(--g)}

<script>
var C={"p": ["ML Fundamentals", "Deep Learning & PyTorch", "CNNs & Crop Disease", "Object Detection & Yield", "Transformers & Ag-Agents"], "d": [{"t": "Foundations of ML & Math Essentials", "w": "Supervised learning learns a mapping from inputs (features) to known answers (labels). We hold data back for validation and testing so the score reflects unseen seasons, not memorised ones. Variance and standard deviation show how spread out yields are.", "ex": "Features: rainfall, fertiliser, year. Label: yield in t/ha. Shuffle 200 farm-season rows, train on 160, test on 40, and report mean yield ± standard deviation.", "pit": "If you predict future seasons, split by year instead of shuffling blindly.", "co": "Fetch a crop yield vs rainfall dataset, split 80/20 in pure NumPy, compute mean, variance, std.", "m": "ISLR Ch.2; StatQuest Machine Learning Basics", "code": "import numpy as np\nidx=np.random.default_rng(0).permutation(len(X))\ncut=int(0.8*len(X)); tr,te=idx[:cut],idx[cut:]\nprint(y[tr].mean(), y[tr].var(), y[tr].std())", "ds": ["Kaggle: Crop Yield Prediction", "https://www.kaggle.com/datasets/patelris/crop-yield-prediction-dataset"], "refs": [["ISLR book", "https://www.statlearning.com"], ["StatQuest", "https://statquest.org"]]}, {"t": "Regression Models & Optimization", "w": "Linear regression fits a line y = w·x + b. MSE measures how far predictions sit from reality. Gradient descent nudges w and b downhill on the MSE surface; the learning rate is the size of each nudge.", "ex": "Nitrogen (kg/ha) → yield. If the learned slope is 0.02 t/ha per kg, adding 50 kg N is expected to add about 1 t/ha, within the range of your data.", "pit": "Too high a learning rate makes the loss bounce or explode; too low crawls. Scale features first.", "co": "Build NumPy linear regression from scratch: manual gradient loop, MSE tracking, Matplotlib loss curve.", "m": "Andrew Ng ML Notes; 3Blue1Brown Gradient Descent", "code": "w=b=0.0; lr=0.01\nfor e in range(500):\n    err=w*x+b-y\n    w-=lr*2*(err*x).mean(); b-=lr*2*err.mean()\n    loss=(err**2).mean()   # store and plot", "ds": ["Kaggle: Crop Yield Prediction", "https://www.kaggle.com/datasets/patelris/crop-yield-prediction-dataset"], "refs": [["Stanford CS229 notes", "https://cs229.stanford.edu"], ["3Blue1Brown neural nets", "https://www.3blue1brown.com/topics/neural-networks"]]}, {"t": "Classification Fundamentals", "w": "Logistic regression turns a weighted sum of features into a probability with the sigmoid, then a threshold (0.5 by default) makes the Yes/No call. Cross-entropy punishes confident wrong answers heavily.", "ex": "Soil moisture 18%, 34 °C, 40% humidity → P(needs water) = 0.87 → irrigate. Lowering the threshold catches more dry fields at the cost of extra watering.", "pit": "Accuracy alone misleads; read the confusion matrix and ROC-AUC.", "co": "Train sklearn LogisticRegression to predict Needs Water; evaluate with confusion matrix and ROC-AUC.", "m": "ISLR Ch.4; StatQuest Logistic Regression", "code": "from sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import confusion_matrix, roc_auc_score\nm=LogisticRegression().fit(Xtr,ytr)\nprint(confusion_matrix(yte,m.predict(Xte)))\nprint(roc_auc_score(yte,m.predict_proba(Xte)[:,1]))", "ds": ["Kaggle: Crop Recommendation (N, P, K, pH, rainfall)", "https://www.kaggle.com/datasets/atharvaingle/crop-recommendation-dataset"], "refs": [["ISLR book", "https://www.statlearning.com"], ["StatQuest", "https://statquest.org"]]}, {"t": "Model Evaluation & Regularization", "w": "Overfitting means memorising noise; underfitting means missing the pattern. L2 shrinks all weights smoothly, L1 can zero some out. F1 combines precision and recall; GridSearchCV tries candidate α values with cross-validation.", "ex": "One odd drought year drags an unregularised yield model around; Ridge with α chosen by GridSearchCV gives steadier predictions on the next season.", "pit": "Tune on validation folds, never on the final test set.", "co": "Add manual L2 to the Day 2 model and use GridSearchCV to find the best α on noisy weather data.", "m": "Géron, Hands-On ML Ch.4", "code": "from sklearn.linear_model import Ridge\nfrom sklearn.model_selection import GridSearchCV\ngs=GridSearchCV(Ridge(),{\"alpha\":[0.01,0.1,1,10,100]},cv=5).fit(Xtr,ytr)\nprint(gs.best_params_)", "ds": ["Kaggle: Crop Yield Prediction", "https://www.kaggle.com/datasets/patelris/crop-yield-prediction-dataset"], "refs": [["Géron Hands-On ML notebooks", "https://github.com/ageron/handson-ml3"], ["scikit-learn grid search", "https://scikit-learn.org/stable/modules/grid_search.html"]]}, {"t": "Introduction to PyTorch & Tensors", "w": "A tensor is an array that can live on the GPU and remember how it was computed. Autograd records operations so loss.backward() fills every parameter’s gradient automatically.", "ex": "The Day 2 nitrogen model: x and y become tensors on cuda, w and b get requires_grad=True, and the hand-written gradient lines disappear.", "pit": "CPU and CUDA tensors can’t be combined; move model and data together, and call optimizer.zero_grad() each step.", "co": "Port the Day 2 regression to PyTorch with torch.tensor, .to('cuda') and loss.backward().", "m": "PyTorch: Learning PyTorch with Examples", "code": "import torch\ndev=\"cuda\" if torch.cuda.is_available() else \"cpu\"\nx=torch.tensor(x,dtype=torch.float32,device=dev)\ny=torch.tensor(y,dtype=torch.float32,device=dev)\nw=torch.zeros(1,device=dev,requires_grad=True)\nb=torch.zeros(1,device=dev,requires_grad=True)\nloss=((w*x+b-y)**2).mean(); loss.backward()", "ds": ["Kaggle: Crop Yield Prediction", "https://www.kaggle.com/datasets/patelris/crop-yield-prediction-dataset"], "refs": [["Learning PyTorch with Examples", "https://pytorch.org/tutorials/beginner/pytorch_with_examples.html"]]}, {"t": "Multi-Layer Perceptrons (MLPs)", "w": "An MLP stacks linear layers with non-linear activations so it can learn curved boundaries. Softmax turns final scores into probabilities that sum to 1; CrossEntropyLoss expects raw scores and class indices.", "ex": "Features: sand %, silt %, clay %, pH, organic matter → four outputs for Clay, Sand, Loam, Silt. The predicted soil type is the highest probability.", "pit": "Don’t add softmax before nn.CrossEntropyLoss; it already includes it.", "co": "Build an nn.Module with two hidden layers to classify soil types; track accuracy.", "m": "Andrej Karpathy: Neural Networks, Zero to Hero", "code": "import torch.nn as nn\nnet=nn.Sequential(nn.Linear(5,32),nn.ReLU(),\n                  nn.Linear(32,16),nn.ReLU(),nn.Linear(16,4))\nloss_fn=nn.CrossEntropyLoss()   # raw scores in, no softmax", "ds": ["Simulate soil data with NumPy (sand, silt, clay %, pH, organic matter)", "https://numpy.org/doc/stable/reference/random/generator.html"], "refs": [["Karpathy: Zero to Hero", "https://karpathy.ai/zero-to-hero.html"]]}, {"t": "Advanced Training Techniques", "w": "Adam gives each weight its own adaptive step size and is a strong default; SGD with momentum can generalise well but needs tuning. Dropout switches off random neurons during training so the network can’t over-rely on one. BatchNorm normalises layer inputs for faster, steadier training.", "ex": "On a small soil dataset the plain MLP’s validation accuracy zig-zags; with BatchNorm1d and Dropout(0.3) the curve smooths out sooner.", "pit": "Use model.train() and model.eval(); dropout and BatchNorm behave differently in each mode.", "co": "Add nn.BatchNorm1d and nn.Dropout(0.3) to the Day 6 model; train 50 epochs and compare curves.", "m": "Stanford CS231n: Neural Networks Part 2", "code": "net=nn.Sequential(nn.Linear(5,32),nn.BatchNorm1d(32),nn.ReLU(),\n                  nn.Dropout(0.3),nn.Linear(32,4))\nopt=torch.optim.Adam(net.parameters(),1e-3)\nnet.train()   # net.eval() when validating", "ds": ["Simulate soil data with NumPy (sand, silt, clay %, pH, organic matter)", "https://numpy.org/doc/stable/reference/random/generator.html"], "refs": [["CS231n Neural Networks Part 2", "https://cs231n.github.io/neural-networks-2/"]]}, {"t": "PyTorch Data Pipelines", "w": "A Dataset says how to fetch one sample (__len__ and __getitem__). A DataLoader groups samples into mini-batches, shuffles them and can load in parallel. Mini-batches make each step cheaper, and slightly noisy gradients often help.", "ex": "A Dataset reads sensor_readings.csv, normalises columns and returns (features, label); with batch_size=32, 1,000 rows give 32 batches per epoch.", "pit": "Fit scalers on training data only, then reuse them for validation and test.", "co": "Write a custom Dataset for the tabular farm data, load batches of 32 and print per-batch status.", "m": "PyTorch Datasets & DataLoaders guide", "code": "from torch.utils.data import Dataset, DataLoader\nclass FarmDS(Dataset):\n    def __init__(s,X,y): s.X,s.y=X,y\n    def __len__(s): return len(s.X)\n    def __getitem__(s,i): return s.X[i],s.y[i]\ndl=DataLoader(FarmDS(X,y),batch_size=32,shuffle=True)\nfor i,(xb,yb) in enumerate(dl): print(\"batch\",i,xb.shape)", "ds": ["Kaggle: Crop Recommendation (N, P, K, pH, rainfall)", "https://www.kaggle.com/datasets/atharvaingle/crop-recommendation-dataset"], "refs": [["PyTorch Datasets & DataLoaders", "https://pytorch.org/tutorials/beginner/basics/data_tutorial.html"]]}, {"t": "Spatial Feature Extraction with CNNs", "w": "A convolution slides a small filter over the image and produces a feature map that lights up where a pattern (edge, texture) appears. Pooling shrinks the map; a final Linear layer classifies the flattened features. Weight sharing keeps CNNs far smaller than fully connected image models.", "ex": "Early filters respond to leaf veins and edges; deeper ones respond to yellow halos or brown lesions that separate diseased from healthy leaves.", "pit": "Resize and normalise every image the same way for train and test (128×128 here).", "co": "Build a shallow CNN (Conv2d, MaxPool2d, Linear) on healthy vs diseased leaf images.", "m": "Brandon Rohrer: How CNNs work", "code": "net=nn.Sequential(nn.Conv2d(3,16,3),nn.ReLU(),nn.MaxPool2d(2),\n  nn.Conv2d(16,32,3),nn.ReLU(),nn.MaxPool2d(2),\n  nn.Flatten(),nn.LazyLinear(2))   # healthy vs diseased", "ds": ["Kaggle: PlantVillage leaf images", "https://www.kaggle.com/datasets/emmarex/plantdisease"], "refs": [["Brandon Rohrer: How CNNs work", "https://www.youtube.com/watch?v=FmpDIaiMIeA"]]}, {"t": "Deep Vision Architectures & ResNet", "w": "In very deep nets, gradients shrink as they travel back and early layers stop learning. A residual block computes F(x) + x, giving the signal a direct shortcut. If extra layers aren’t useful, the block can learn F(x) ≈ 0 and pass x through.", "ex": "Residual blocks let the leaf classifier go deeper to separate look-alikes such as early and late blight without training stalling.", "pit": "Shapes must match at the addition; use a 1×1 convolution on the shortcut when channels or stride change.", "co": "Implement a lightweight ResNet block with an identity shortcut and plug it into the Day 9 classifier.", "m": "He et al.: Deep Residual Learning", "code": "class Block(nn.Module):\n    def __init__(s,c):\n        super().__init__()\n        s.f=nn.Sequential(nn.Conv2d(c,c,3,padding=1),nn.BatchNorm2d(c),nn.ReLU(),\n                          nn.Conv2d(c,c,3,padding=1),nn.BatchNorm2d(c))\n    def forward(s,x): return torch.relu(s.f(x)+x)   # skip connection", "ds": ["Kaggle: PlantVillage leaf images", "https://www.kaggle.com/datasets/emmarex/plantdisease"], "refs": [["Deep Residual Learning (paper)", "https://arxiv.org/abs/1512.03385"]]}, {"t": "Transfer Learning & Data Augmentation", "w": "A model trained on ImageNet already knows edges, textures and shapes. Freezing the backbone and training only a new final layer needs little data and GPU time. Augmentation creates varied copies of each image so the model copes with real-farm conditions.", "ex": "ResNet18 plus a new head for tomato diseases; RandomResizedCrop and ColorJitter imitate different sun angles and phone cameras.", "pit": "Use ImageNet mean/std normalisation, and no random augmentation on validation images.", "co": "Freeze ResNet18, replace the final layer, apply transforms.v2 and train a Tomato Leaf Disease Classifier.", "m": "PyTorch Transfer Learning Tutorial", "code": "from torchvision import models\nfrom torchvision.transforms import v2\nm=models.resnet18(weights=\"DEFAULT\")\nfor p in m.parameters(): p.requires_grad=False\nm.fc=nn.Linear(512,10)   # tomato disease classes\naug=v2.Compose([v2.RandomResizedCrop(224),v2.ColorJitter(.3,.3,.3),\n                v2.ToImage(),v2.ToDtype(torch.float32,scale=True)])", "ds": ["Kaggle: Tomato leaf disease images", "https://www.kaggle.com/datasets/kaustubhb999/tomatoleaf"], "refs": [["PyTorch Transfer Learning", "https://pytorch.org/tutorials/beginner/transfer_learning_tutorial.html"]]}, {"t": "Imbalanced Data & Advanced Metrics", "w": "When one class dominates, a model can score high accuracy by always predicting it. Weighted loss makes mistakes on the rare class cost more. Precision-Recall curves judge the rare class without the majority class inflating the score.", "ex": "If only 2% of leaves show a quarantine disease, a model that always says “healthy” is 98% accurate and useless. Weight the rare class higher and watch its recall.", "pit": "Weights are usually inverse to class frequency; check their order matches the class indices.", "co": "Drop 90% of diseased images, watch metrics fail, then fix with CrossEntropyLoss(weight=...).", "m": "Google ML Crash Course: Imbalanced Data", "code": "cnt=torch.bincount(ytr)\nw=cnt.sum()/(len(cnt)*cnt)          # rare class gets a bigger weight\nloss_fn=nn.CrossEntropyLoss(weight=w.float().to(dev))", "ds": ["Kaggle: PlantVillage leaf images", "https://www.kaggle.com/datasets/emmarex/plantdisease"], "refs": [["Google ML Crash Course: imbalanced data", "https://developers.google.com/machine-learning/crash-course/overfitting/imbalanced-datasets"]]}, {"t": "Bounding Box Foundations", "w": "Detection predicts where an object is as well as what it is. Boxes are stored as corners (x1, y1, x2, y2) or centre, width, height. IoU divides overlap area by union area: 1 is perfect, 0 is no overlap, and 0.5 is a common cutoff for a correct detection.", "ex": "A labelled apple box vs a predicted box shifted slightly: the overlap is large, so IoU is high and the detection counts as a hit.", "pit": "Clamp intersection width and height at 0 for non-overlapping boxes, or IoU can go negative.", "co": "Write a PyTorch IoU function and test it on apple annotations vs simulated predictions.", "m": "PyImageSearch: bounding boxes explained", "code": "def iou(a,b):   # boxes as tensors [x1,y1,x2,y2]\n    x1=torch.max(a[0],b[0]); y1=torch.max(a[1],b[1])\n    x2=torch.min(a[2],b[2]); y2=torch.min(a[3],b[3])\n    inter=(x2-x1).clamp(0)*(y2-y1).clamp(0)\n    union=(a[2]-a[0])*(a[3]-a[1])+(b[2]-b[0])*(b[3]-b[1])-inter\n    return inter/union", "ds": ["Hand-write 4 to 6 box coordinates for apples or weeds", "https://colab.research.google.com/#create=true"], "refs": [["PyImageSearch", "https://pyimagesearch.com"]]}, {"t": "One-Stage Object Detectors", "w": "YOLO looks at the whole image once and outputs many candidate boxes with class scores. Several boxes often land on the same object. NMS keeps the highest-confidence box, discards others whose IoU with it is above a threshold, then repeats.", "ex": "One weed patch gets five overlapping boxes; with a 0.5 IoU threshold, NMS leaves one box per weed.", "pit": "A threshold that’s too low merges neighbouring plants; too high leaves duplicates.", "co": "Implement the NMS sorting loop from scratch on mock detected-weed boxes.", "m": "Redmon et al.: You Only Look Once", "code": "def nms(boxes,scores,thr=0.5):\n    order=scores.argsort(descending=True).tolist(); keep=[]\n    while order:\n        i=order.pop(0); keep.append(i)\n        order=[j for j in order if iou(boxes[i],boxes[j])<thr]\n    return keep", "ds": ["Hand-write 4 to 6 box coordinates for apples or weeds", "https://colab.research.google.com/#create=true"], "refs": [["You Only Look Once (paper)", "https://arxiv.org/abs/1506.02640"]]}, {"t": "The Ultralytics Framework on T4", "w": "Ultralytics packages YOLOv8 for loading, predicting and training. Model sizes (n, s, m, l, x) trade accuracy for speed and memory; nano is the safe choice on a free T4. Results give boxes, classes and confidences per image.", "ex": "Run yolov8n.pt on a farm photo to find standard classes such as cow, sheep or truck; tractors and crop diseases need custom training.", "pit": "Pre-trained COCO weights don’t know your crops; Day 16 fixes that.", "co": "Install ultralytics, load YOLOv8n and run inference on a farm image or video.", "m": "Ultralytics YOLOv8 documentation", "code": "!pip -q install ultralytics\nfrom ultralytics import YOLO\nr=YOLO(\"yolov8n.pt\")(\"farm.jpg\")\nr[0].show()", "ds": ["Roboflow Universe: search fruit / pepper / weed detection", "https://universe.roboflow.com"], "refs": [["Ultralytics docs", "https://docs.ultralytics.com"]]}, {"t": "Custom Ag Object Detection", "w": "Custom detection needs labelled images and a data.yaml file listing train/val folders and class names. Fine-tuning starts from pre-trained weights, so 20 epochs on a small dataset can already work. Counting detections per image gives a simple yield proxy.", "ex": "On a sweet-pepper dataset, count boxes per plant image to compare plots, then calibrate counts against harvested fruit.", "pit": "Counts miss hidden fruit; treat them as estimates and validate on hand-counted images.", "co": "Download a Roboflow fruit/veggie dataset (YOLO format), train YOLOv8n for 20 epochs, estimate counts.", "m": "Roboflow: train YOLOv8 on a custom dataset", "code": "from ultralytics import YOLO\nm=YOLO(\"yolov8n.pt\")\nm.train(data=\"data.yaml\",epochs=20,imgsz=640)\nprint(\"fruit count:\",len(m.predict(\"test.jpg\")[0].boxes))", "ds": ["Roboflow Universe: search fruit / pepper / weed detection", "https://universe.roboflow.com"], "refs": [["Roboflow Universe", "https://universe.roboflow.com"], ["Ultralytics training guide", "https://docs.ultralytics.com/modes/train/"]]}, {"t": "Attention Mechanics & Vision Transformers", "w": "A Vision Transformer cuts an image into fixed patches, flattens each and projects it to an embedding, producing a sequence like words in a sentence. Self-attention lets every patch weigh every other patch. Cost grows with the number of tokens, so ViTs use more memory than small CNNs.", "ex": "A 224×224 leaf split into 16×16 patches gives 14×14 = 196 tokens, each with 16×16×3 = 768 numbers, then a linear layer maps them to the embedding size.", "pit": "Image size must divide by patch size: 224 works, 226 doesn’t.", "co": "Slice a leaf image into 16×16 patches, flatten into tokens and pass through a linear layer.", "m": "Jay Alammar: The Illustrated Transformer", "code": "img=torch.rand(3,224,224)                      # stand-in for a leaf photo\np=img.unfold(1,16,16).unfold(2,16,16)          # 3 x 14 x 14 x 16 x 16\ntok=p.permute(1,2,0,3,4).reshape(196,-1)       # 196 tokens x 768\nemb=nn.Linear(768,256)(tok)", "ds": ["Kaggle: PlantVillage leaf images", "https://www.kaggle.com/datasets/emmarex/plantdisease"], "refs": [["The Illustrated Transformer", "https://jalammar.github.io/illustrated-transformer/"]]}, {"t": "Zero-Shot Ag-Classification with CLIP", "w": "CLIP trains an image encoder and a text encoder so matching pairs land close together. To classify, embed the image and each candidate sentence, then softmax the similarities. New classes need only new text, with no retraining.", "ex": "Candidate labels: “healthy wheat field”, “dry patch of land needing water”, “crop field damaged by pests”. The highest probability wins.", "pit": "Wording matters; try several phrasings, and don’t treat the output as a diagnosis.", "co": "Load openai/clip-vit-base-patch32 and classify unlabelled crop images with custom text labels.", "m": "OpenAI Blog: CLIP", "code": "from transformers import CLIPModel, CLIPProcessor\nn=\"openai/clip-vit-base-patch32\"\nm=CLIPModel.from_pretrained(n); pr=CLIPProcessor.from_pretrained(n)\nlabels=[\"healthy wheat field\",\"dry patch of land needing water\",\"crop field damaged by pests\"]\nx=pr(text=labels,images=img,return_tensors=\"pt\",padding=True)\nprint(m(**x).logits_per_image.softmax(1))", "ds": ["Kaggle: PlantVillage leaf images", "https://www.kaggle.com/datasets/emmarex/plantdisease"], "refs": [["OpenAI: CLIP", "https://openai.com/index/clip/"], ["CLIP model card", "https://huggingface.co/openai/clip-vit-base-patch32"]]}, {"t": "Vision-Language Modeling for Diagnosis", "w": "A vision-language model encodes the image and passes those features to a language decoder that generates text. BLIP-base can caption an image or continue a text prompt. Visual question answering asks a direct question about the picture.", "ex": "Prompt “a close up photo of a plant leaf showing symptoms of” and read the continuation; use it to draft notes for an agronomist to verify.", "pit": "Generated text can sound confident and be wrong; show it beside the image with a human check.", "co": "Load Salesforce/blip-image-captioning-base and generate text for plant-disease or farm images.", "m": "Hugging Face Multimodal Models guide", "code": "from transformers import BlipProcessor, BlipForConditionalGeneration\nn=\"Salesforce/blip-image-captioning-base\"\npr=BlipProcessor.from_pretrained(n); m=BlipForConditionalGeneration.from_pretrained(n)\nx=pr(img,\"A close up photo of a plant leaf showing symptoms of \",return_tensors=\"pt\")\nprint(pr.decode(m.generate(**x,max_new_tokens=30)[0],skip_special_tokens=True))", "ds": ["Kaggle: PlantVillage leaf images", "https://www.kaggle.com/datasets/emmarex/plantdisease"], "refs": [["BLIP model card", "https://huggingface.co/Salesforce/blip-image-captioning-base"], ["Hugging Face Transformers docs", "https://huggingface.co/d
